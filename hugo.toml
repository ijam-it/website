baseURL = "https://ijam-it.nl"
title = "iJam® IT Solutions"
locale = "nl-NL"
defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false
enableInlineShortcodes = true
theme = ["hugo-cloak-email", "tella"]
enableRobotsTXT = true
cleanDestinationDir = true

[params]
  description = "iJam® helpt organisaties complexe digitale vraagstukken eenvoudiger, veiliger en beter beheersbaar te maken."
  tagline = "Experienced minds. Reliable solutions."
  showBlog = false
  mainSections = []
  googleFonts = true

  [params.logo]
    main = "img/logo/logo.png"
    alt = "iJam® IT Solutions"
    size = "h-14"

  [params.site]
    name = "iJam®"
    legalName = "iJam® IT Solutions"

  [params.icon]
    fontawesome = true

[languages]
  [languages.nl]
    label = "Nederlands"
    locale = "nl-NL"
    weight = 1
    title = "iJam® IT Solutions"
    contentDir = "content/nl"
    [languages.nl.params]
      description = "iJam® helpt organisaties complexe digitale vraagstukken eenvoudiger, veiliger en beter beheersbaar te maken."
      contactEmail = "info@ijam-it.nl"
      footerIntro = "Experienced minds. Reliable solutions."

  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
    title = "iJam® IT Solutions"
    contentDir = "content/en"
    [languages.en.params]
      description = "iJam® helps organisations make complex digital challenges simpler, safer and easier to manage."
      contactEmail = "info@ijam-it.nl"
      footerIntro = "Experienced minds. Reliable solutions."

