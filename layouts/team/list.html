{{ define "main" }}
<section class="page-shell">
  <header class="page-hero compact">
    <p class="eyebrow">iJam</p>
    <h1>{{ .Title }}<span class="blue-dot">.</span></h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  <div class="team-intro-grid">
  {{ if .Content }}
  <div class="content-panel prose-content brand-panel">
    {{ .Content }}
  </div>
  {{ end }}
    {{ with .Params.proof }}
      <aside class="team-proof">
        <strong>{{ .title }}<span class="blue-dot">.</span></strong>
        <span>{{ .text }}</span>
      </aside>
    {{ end }}
  </div>
  <div class="card-grid team-grid">
    {{ range .Pages.ByWeight }}
      <article class="person-card reveal-up">
        <div class="person-mark" aria-hidden="true">{{ substr .Title 0 1 }}</div>
        <h2>{{ .Title }}</h2>
        <p>{{ .Description }}</p>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
