{{ define "main" }}
<section class="page-shell">
  <header class="page-hero compact">
    <p class="eyebrow">iJam</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  {{ if .Content }}
  <div class="content-panel prose-content">
    {{ .Content }}
  </div>
  {{ end }}
  <div class="card-grid team-grid">
    {{ range .Pages.ByWeight }}
      <article class="person-card reveal-up">
        <div class="person-mark" aria-hidden="true">{{ substr .Title 0 1 }}</div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Description }}</p>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
