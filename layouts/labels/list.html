{{ define "main" }}
<section class="page-shell">
  <header class="page-hero compact">
    <p class="eyebrow">iJam ecosystem</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  {{ if .Content }}
  <div class="content-panel prose-content">
    {{ .Content }}
  </div>
  {{ end }}
  <div class="card-grid two-cols">
    {{ range .Pages.ByWeight }}
      <article class="info-card label-card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Description }}</p>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
