<header class="site-header">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="iJam home">
    <img src="{{ .Site.Params.logo.main | relURL }}" alt="{{ .Site.Params.logo.alt }}">
  </a>
  <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false">
    <span>Menu</span>
  </button>
  <nav id="site-nav" class="site-nav" aria-label="Main navigation">
    {{- $current := .RelPermalink }}
    {{- range .Site.Menus.main }}
      {{- $menuURL := .URL | relURL }}
      {{- $isHome := eq .Identifier "home" }}
      {{- $isActive := or (eq $current $menuURL) (and (not $isHome) (strings.HasPrefix $current $menuURL)) }}
      <a href="{{ $menuURL }}"{{ if $isActive }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  {{ partial "lang-switch.html" . }}
</header>
