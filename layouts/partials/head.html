{{- partial "analytics" . -}}
<meta charset="utf-8">
<title>{{site.Title}}{{if not .IsHome}} | {{.Title}}{{end}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<!-- Open Graph / Facebook / Twitter SEO -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{site.Title}}{{if not .IsHome}} | {{.Title}}{{end}}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:image" content="{{ "/img/og-image.jpg" | absURL }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{site.Title}}{{if not .IsHome}} | {{.Title}}{{end}}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="twitter:image" content="{{ "/img/og-image.jpg" | absURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ "favicon-64x64.png" | relURL }}" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" />
<link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ "apple-touch-icon.png" | relURL }}" />
<meta name="apple-mobile-web-app-title" content="{{site.Title}}" />
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}" />

{{ if .Site.Params.icon.fontawesome }}
<link href='{{ "/css/fa7.min.css" | relURL }}' rel="stylesheet" type="text/css">
{{ end }}
{{ if .Site.Params.icon.bootstrap }}
<link href='{{ "/css/bootstrap-icons.min.css" | relURL }}' rel="stylesheet" type="text/css">
{{ end }}

<link rel="stylesheet" href='{{ "/css/style.css" | relURL }}'>

{{ if .IsHome }}
<link rel="stylesheet" href='{{ "/css/splide.min.css" | relURL }}'>
{{ end }}

<link rel="stylesheet" href='{{ "/css/custom.css" | relURL }}'>
