<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <a class="footer-brand" href="{{ .Site.Home.RelPermalink }}">iJam</a>
      <p>{{ .Site.Params.footerIntro }}</p>
      <p class="registered">iJam IT Solutions</p>
    </div>
    <nav class="footer-links" aria-label="Footer navigation">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <a href="#">Privacy</a>
      <a href="#">Cookies</a>
    </nav>
  </div>
  <div class="footer-bottom">
    <span>&copy; {{ now.Year }} iJam IT Solutions</span>
    <a href="mailto:{{ .Site.Params.contactEmail }}">{{ .Site.Params.contactEmail }}</a>
  </div>
</footer>
<script>
  document.documentElement.classList.add('js');

  const navToggle = document.querySelector('.nav-toggle');
  const siteNav = document.querySelector('#site-nav');
  if (navToggle && siteNav) {
    navToggle.addEventListener('click', () => {
      const isOpen = navToggle.getAttribute('aria-expanded') === 'true';
      navToggle.setAttribute('aria-expanded', String(!isOpen));
      siteNav.classList.toggle('is-open');
    });
  }

  // Scroll Reveal Animations
  const observerOptions = {
    root: null,
    rootMargin: '0px',
    threshold: 0.1
  };
  const observer = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, observerOptions);
  document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
</script>
